name: Run SSM phase
description: Runs a script on EC2 instances through SSM and waits for every instance to finish

inputs:
  phase:
    description: Phase name shown in logs
    required: true
  instance-ids:
    description: Space-separated EC2 instance IDs
    required: true
  script:
    description: Bash script body to run on the instances
    required: true
  timeout:
    description: Seconds to wait for each instance
    required: false
    default: "600"

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.phase }}
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        INSTANCE_IDS: ${{ inputs.instance-ids }}
        PHASE_SCRIPT: ${{ inputs.script }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail

        echo "========================================"
        echo "${PHASE}"
        echo "========================================"

        # Validate APP_ROOT
        if [[ -z "${APP_ROOT:-}" ]]; then
          echo "::error::APP_ROOT is empty or unavailable."
          echo "::error::Check the GitHub Environment secrets and job-level environment."
          exit 1
        fi

        # Validate instance IDs
        if [[ -z "${INSTANCE_IDS//[[:space:]]/}" ]]; then
          echo "::error::No EC2 instance IDs were provided to the SSM action."
          echo "::error::Check the Prepare deployment job and instance_ids output."
          exit 1
        fi

        # Parse instance IDs safely
        read -r -a INSTANCE_ID_ARRAY <<< "${INSTANCE_IDS}"

        if [[ "${#INSTANCE_ID_ARRAY[@]}" -eq 0 ]]; then
          echo "::error::No valid EC2 instance IDs were found."
          exit 1
        fi

        # Validate instance ID format and mask identifiers.
        # Masking happens here (not in the prepare job) so that the
        # instance_ids job output is not discarded by GitHub.
        for INSTANCE_ID in "${INSTANCE_ID_ARRAY[@]}"; do
          if [[ ! "${INSTANCE_ID}" =~ ^i-[0-9a-fA-F]{8}([0-9a-fA-F]{9})?$ ]]; then
            echo "::error::An invalid EC2 instance ID was provided."
            exit 1
          fi

          echo "::add-mask::${INSTANCE_ID}"
        done

        echo "Target instance count: ${#INSTANCE_ID_ARRAY[@]}"

        # Validate timeout
        if [[ ! "${TIMEOUT}" =~ ^[0-9]+$ ]] || (( TIMEOUT < 1 )); then
          echo "::error::Invalid SSM timeout value."
          exit 1
        fi

        # Generate remote execution script
        SCRIPT_FILE="${RUNNER_TEMP}/phase.sh"

        echo '#!/usr/bin/env bash' > "${SCRIPT_FILE}"

        # Forward required environment variables
        for VAR in APP_DISPLAY_NAME APP_ROOT APP_PORT APP_BASE_PATH GIT_BRANCH PM2_APP_NAME REPO_URL; do
          if [[ -n "${!VAR+x}" ]]; then
            printf '%s=%q\n' "${VAR}" "${!VAR}" >> "${SCRIPT_FILE}"
          fi
        done

        cat >> "${SCRIPT_FILE}" <<'PREAMBLE'
        set -euo pipefail

        # Validate application directory
        if [[ -z "${APP_ROOT:-}" ]]; then
          echo "ERROR: APP_ROOT is not configured."
          exit 1
        fi

        STATE_FILE="/var/tmp/deploy-$(basename "${APP_ROOT}").state"
        NODE_MODULES_BACKUP="${APP_ROOT}/node_modules_backup"
        BUILD_BACKUP="${APP_ROOT}/.next_backup"

        export HOME="/root"
        export NVM_DIR="/root/.nvm"

        if [[ ! -f "${NVM_DIR}/nvm.sh" ]]; then
          echo "ERROR: NVM was not found at ${NVM_DIR}/nvm.sh"
          exit 1
        fi

        source "${NVM_DIR}/nvm.sh"

        nvm use 20

        if [[ -f "${STATE_FILE}" ]]; then
          source "${STATE_FILE}"
        fi
        PREAMBLE

        printf '%s\n' "${PHASE_SCRIPT}" >> "${SCRIPT_FILE}"

        # Submit SSM command
        echo "Submitting SSM command..."

        if ! COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${INSTANCE_ID_ARRAY[@]}" \
          --document-name "AWS-RunShellScript" \
          --comment "${PHASE} deployment" \
          --parameters "$(jq -n --rawfile script "${SCRIPT_FILE}" '{commands: [$script]}')" \
          --query 'Command.CommandId' \
          --output text 2>/dev/null); then
          echo "::error::${PHASE} could not be submitted to the target instances."
          exit 1
        fi

        if [[ -z "${COMMAND_ID}" || "${COMMAND_ID}" == "None" ]]; then
          echo "::error::AWS SSM returned an empty command ID."
          exit 1
        fi

        echo "::add-mask::${COMMAND_ID}"
        echo "SSM command submitted successfully."

        FAILED=false

        # Wait for every target instance
        for INSTANCE_ID in "${INSTANCE_ID_ARRAY[@]}"; do
          echo ""
          echo "----------------------------------------"
          echo "${PHASE} on target instance"
          echo "----------------------------------------"

          STATUS="Pending"
          DEADLINE=$((SECONDS + TIMEOUT))

          while (( SECONDS < DEADLINE )); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "${STATUS}" in
              Success|Failed|Cancelled|Cancelling|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          # Fetch standard output
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || true)

          if [[ -n "${OUTPUT}" && "${OUTPUT}" != "None" ]]; then
            printf '%s\n' "${OUTPUT}" | sed -E \
              -e 's/i-[0-9a-fA-F]{8,17}/[REDACTED_INSTANCE_ID]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/[REDACTED_COMMAND_ID]/g' \
              -e 's/\b[0-9a-fA-F]{40}\b/[REDACTED_COMMIT_ID]/g'
          fi

          # Fetch standard error
          ERRORS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text 2>/dev/null || true)

          if [[ -n "${ERRORS}" && "${ERRORS}" != "None" ]]; then
            echo ""
            echo "Error output:"

            printf '%s\n' "${ERRORS}" | sed -E \
              -e 's/i-[0-9a-fA-F]{8,17}/[REDACTED_INSTANCE_ID]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/[REDACTED_COMMAND_ID]/g' \
              -e 's/\b[0-9a-fA-F]{40}\b/[REDACTED_COMMIT_ID]/g'
          fi

          # Check final execution status
          if [[ "${STATUS}" != "Success" ]]; then
            echo "::error::${PHASE} failed on a target instance (status: ${STATUS})"
            FAILED=true
          else
            echo "${PHASE} completed successfully on a target instance."
          fi
        done

        if [[ "${FAILED}" == "true" ]]; then
          echo "::error::${PHASE} failed on one or more instances."
          exit 1
        fi

        echo ""
        echo "========================================"
        echo "${PHASE} completed successfully."
        echo "========================================"